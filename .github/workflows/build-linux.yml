name: Build Surfeo Linux Client

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable Linux Desktop & Create Scaffolding
        run: |
          flutter config --no-analytics
          flutter config --enable-linux-desktop
          flutter create --project-name surfeo_pc --platforms=linux .

      - name: Build Surfeo Core Daemon (Go)
        run: |
          cd core
          go mod tidy
          go build -ldflags="-s -w" -o ../linux_bundle/surfeo-core main.go
          cd ..

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Linux App
        run: flutter build linux --release

      - name: Assemble Release Bundle
        run: |
          mkdir -p linux_bundle
          cp -r build/linux/x64/release/bundle/* linux_bundle/
          tar -czvf Surfeo-Linux-x64.tar.gz -C linux_bundle .

      - name: Upload Linux Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surfeo-Linux-x64
          path: Surfeo-Linux-x64.tar.gz
          retention-days: 14
